<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      max-width: 480px;
    }
    h1 {
      font-size: 18px;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    select {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
    }
    .warning {
      color: #b00020;
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }
    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 6px;
    }
    button {
      margin-top: 24px;
      padding: 8px 16px;
    }
    .error-banner {
      background: #fdecea;
      color: #b00020;
      padding: 8px 12px;
      margin-top: 16px;
      border-radius: 4px;
      display: none;
    }
    .error-banner details {
      margin-top: 6px;
    }
    .error-banner summary {
      cursor: pointer;
      font-size: 12px;
      color: #b00020;
    }
    .error-banner .error-raw {
      margin-top: 4px;
      font-size: 11px;
      font-family: monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>SMT — เลือกข้อมูล Alignment</h1>

  <div id="errorBanner" class="error-banner"></div>

  <label for="catSelect">1. หมวด</label>
  <select id="catSelect" disabled onchange="handleCategoryChange()">
    <option value="">กำลังโหลด...</option>
  </select>

  <label for="fileSelect">2. ไฟล์ Google Sheets</label>
  <select id="fileSelect" disabled onchange="handleFileChange()">
    <option value="">-- เลือกหมวดก่อน --</option>
  </select>
  <div id="fileWarning" class="warning"></div>

  <label for="tabSelect">3. Alignment / Tab</label>
  <select id="tabSelect" disabled>
    <option value="">-- เลือกไฟล์ก่อน --</option>
  </select>
  <div id="tabWarning" class="warning"></div>

  <button id="calcBtn" onclick="handleCalcClick()">คำนวณ</button>
  <div id="calcStatus" class="hint"></div>

  <script>
    function setLoading(selectEl) {
      selectEl.innerHTML = '<option value="">กำลังโหลด...</option>';
      selectEl.disabled = true;
    }

    function setPlaceholder(selectEl, text) {
      selectEl.innerHTML = '<option value="">' + text + '</option>';
      selectEl.disabled = true;
    }

    function setEmpty(selectEl, warningEl, emptyText, warningText) {
      selectEl.innerHTML = '<option value="">' + emptyText + '</option>';
      selectEl.disabled = true;
      warningEl.textContent = warningText;
      warningEl.style.display = 'block';
    }

    function clearWarning(warningEl) {
      warningEl.textContent = '';
      warningEl.style.display = 'none';
    }

    // แต่ละแถวจับ pattern ของ raw error message จริงจากฝั่ง server (.gs)
    // ไล่ทดสอบตามลำดับ ตัวแรกที่ match ชนะ ไม่ match เลยสักแถว = ใช้ catchall ท้ายสุด
    var ERROR_MESSAGE_MAP = [
      {
        test: /^ไม่พบ tab "(.+)" ในไฟล์นี้$/,
        friendly: function (m) {
          return 'ไม่พบแท็บ (tab) ชื่อ "' + m[1] + '" ในไฟล์นี้แล้ว — ' +
            'อาจถูกลบหรือเปลี่ยนชื่อไประหว่างที่หน้านี้เปิดอยู่ กรุณาเลือกไฟล์ใหม่อีกครั้ง';
        }
      },
      {
        test: /^invalid numeric cell: "(.*)"$/,
        friendly: function (m) {
          return 'พบข้อมูลตัวเลขที่อ่านไม่ได้ในตาราง ("' + m[1] + '") — ' +
            'ตรวจสอบคอลัมน์ตัวเลข (เช่น RADIUS, DISTANCE, ANGLE) ว่ากรอกเป็นตัวเลขล้วนๆ ' +
            'ไม่มีตัวอักษร, comma, หรือช่องว่างปน แล้วลองคำนวณใหม่';
        }
      },
      {
        test: /^PI "(.+?)" \(แถวที่ (\d+)\)[\s\S]*compound sub-row/,
        friendly: function (m) {
          return 'ข้อมูลขัดแย้งกันที่ ' + m[1] + ' (แถวที่ ' + m[2] + ' ในตาราง) — ' +
            'มีการกรอกค่ารัศมีไว้ทั้งที่แถวหลักและแถวย่อย (compound) ระบบไม่แน่ใจว่าจะใช้ค่าไหน ' +
            'กรุณาลบค่ารัศมีที่ซ้ำออกแถวใดแถวหนึ่งแล้วลองใหม่';
        }
      },
      {
        test: /อยู่นอกแนวเส้นทาง|ตกนอกทุก element/,
        friendly: function () {
          return 'จุดตรวจสอบบางจุดอยู่นอกช่วงแนวเส้นทาง (alignment) — ' +
            'ตรวจสอบว่าค่า station ในตารางอยู่ในช่วง PC ถึง PT ของแนวนี้หรือไม่';
        }
      },
      {
        test: /scanRawRows_|vertexIndex/,
        friendly: function () {
          return 'เกิดข้อผิดพลาดภายในระบบระหว่างตรวจสอบไขว้ (cross-check) — ' +
            'ไม่ใช่ปัญหาจากข้อมูลของท่าน กรุณาแจ้งผู้ดูแลระบบพร้อมข้อความรายละเอียดด้านล่าง';
        }
      },
      {
        test: /permission|Invalid argument/i,
        friendly: function () {
          return 'ไม่สามารถเข้าถึงไฟล์นี้ได้ — อาจเป็นเพราะยังไม่ได้รับสิทธิ์เข้าถึง หรือไฟล์' +
            'อาจถูกลบ/ย้ายตำแหน่งไปแล้ว กรุณาตรวจสอบกับ CK1024';
        }
      }
    ];

    function getFriendlyMessage(rawMessage) {
      for (var i = 0; i < ERROR_MESSAGE_MAP.length; i++) {
        var m = ERROR_MESSAGE_MAP[i].test.exec(rawMessage);
        if (m) return ERROR_MESSAGE_MAP[i].friendly(m);
      }
      return 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุแน่ชัด — กรุณาลองใหม่อีกครั้ง ' +
        'หากยังไม่หายกรุณาแจ้งผู้ดูแลระบบพร้อมข้อความรายละเอียดด้านล่าง';
    }

    function showError(err) {
      var banner = document.getElementById('errorBanner');
      var rawMessage = (err && err.message) ? err.message : String(err);
      var friendlyMessage = getFriendlyMessage(rawMessage);

      banner.textContent = '';

      var friendlyEl = document.createElement('div');
      friendlyEl.textContent = friendlyMessage;
      banner.appendChild(friendlyEl);

      var details = document.createElement('details');
      var summary = document.createElement('summary');
      summary.textContent = 'รายละเอียดทางเทคนิค (สำหรับแจ้งผู้ดูแลระบบ)';
      details.appendChild(summary);

      var rawEl = document.createElement('div');
      rawEl.className = 'error-raw';
      rawEl.textContent = rawMessage;
      details.appendChild(rawEl);

      banner.appendChild(details);
      banner.style.display = 'block';
    }

    function clearError() {
      var banner = document.getElementById('errorBanner');
      banner.style.display = 'none';
      banner.textContent = '';
    }

    window.onload = function () {
      google.script.run
        .withSuccessHandler(populateCategories)
        .withFailureHandler(showError)
        .listCategoryFolders();
    };

    function populateCategories(categories) {
      var catSelect = document.getElementById('catSelect');
      catSelect.innerHTML = '';

      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- เลือกหมวด --';
      catSelect.appendChild(placeholder);

      categories.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        catSelect.appendChild(opt);
      });

      catSelect.disabled = false;
    }

    function handleCategoryChange() {
      clearError();

      var catSelect = document.getElementById('catSelect');
      var fileSelect = document.getElementById('fileSelect');
      var tabSelect = document.getElementById('tabSelect');
      var fileWarning = document.getElementById('fileWarning');
      var tabWarning = document.getElementById('tabWarning');

      clearWarning(fileWarning);
      clearWarning(tabWarning);
      setPlaceholder(tabSelect, '-- เลือกไฟล์ก่อน --');

      var folderId = catSelect.value;
      if (!folderId) {
        setPlaceholder(fileSelect, '-- เลือกหมวดก่อน --');
        return;
      }

      setLoading(fileSelect);

      google.script.run
        .withSuccessHandler(function (files) { populateFiles(files); })
        .withFailureHandler(showError)
        .listFilesInFolder(folderId);
    }

    function populateFiles(files) {
      var fileSelect = document.getElementById('fileSelect');
      var fileWarning = document.getElementById('fileWarning');

      if (!files || files.length === 0) {
        setEmpty(
          fileSelect,
          fileWarning,
          'ไม่มีไฟล์ในหมวดนี้',
          'หมวดนี้ไม่มีไฟล์ Google Sheets — เลือกหมวดอื่น หรือเพิ่มไฟล์ในหมวดนี้ก่อน'
        );
        return;
      }

      fileSelect.innerHTML = '';

      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- เลือกไฟล์ --';
      fileSelect.appendChild(placeholder);

      files.forEach(function (f) {
        var opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.name;
        fileSelect.appendChild(opt);
      });

      fileSelect.disabled = false;
    }

    function handleFileChange() {
      clearError();

      var fileSelect = document.getElementById('fileSelect');
      var tabSelect = document.getElementById('tabSelect');
      var tabWarning = document.getElementById('tabWarning');

      clearWarning(tabWarning);

      var fileId = fileSelect.value;
      if (!fileId) {
        setPlaceholder(tabSelect, '-- เลือกไฟล์ก่อน --');
        return;
      }

      setLoading(tabSelect);

      google.script.run
        .withSuccessHandler(populateTabs)
        .withFailureHandler(showError)
        .listAlignmentTabsInFile(fileId);
    }

    function populateTabs(tabs) {
      var tabSelect = document.getElementById('tabSelect');
      var tabWarning = document.getElementById('tabWarning');

      if (!tabs || tabs.length === 0) {
        setEmpty(
          tabSelect,
          tabWarning,
          'ไม่มี alignment ในไฟล์นี้',
          'ไม่พบ tab ที่เป็น alignment ในไฟล์นี้ — ตรวจสอบไฟล์ หรือเลือกไฟล์อื่น'
        );
        return;
      }

      tabSelect.innerHTML = '';

      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '-- เลือก alignment --';
      tabSelect.appendChild(placeholder);

      tabs.forEach(function (name) {
        var opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        tabSelect.appendChild(opt);
      });

      tabSelect.disabled = false;
    }

    function handleCalcClick() {
      clearError();

      var catSelect = document.getElementById('catSelect');
      var fileSelect = document.getElementById('fileSelect');
      var tabSelect = document.getElementById('tabSelect');
      var calcBtn = document.getElementById('calcBtn');
      var calcStatus = document.getElementById('calcStatus');

      var fileId = fileSelect.value;
      var tabName = tabSelect.value;

      catSelect.disabled = true;
      fileSelect.disabled = true;
      tabSelect.disabled = true;
      calcBtn.disabled = true;
      calcStatus.textContent = 'กำลังคำนวณ...';

      google.script.run
        .withSuccessHandler(onCalcDone)
        .withFailureHandler(onCalcFail)
        .runFullPipeline(fileId, tabName);
    }

    function onCalcDone(summary) {
      document.getElementById('catSelect').disabled = false;
      document.getElementById('fileSelect').disabled = false;
      document.getElementById('tabSelect').disabled = false;
      document.getElementById('calcBtn').disabled = false;

      var calcStatus = document.getElementById('calcStatus');
      calcStatus.textContent = 'คำนวณเสร็จแล้ว: ' + summary.elementsCount + ' elements' +
        (summary.issuesCount ? ', พบ issues ' + summary.issuesCount + ' รายการ' : ', ไม่พบ issues');
    }

    function onCalcFail(err) {
      document.getElementById('catSelect').disabled = false;
      document.getElementById('fileSelect').disabled = false;
      document.getElementById('tabSelect').disabled = false;
      document.getElementById('calcBtn').disabled = false;

      showError(err);
    }
  </script>
</body>
</html>
